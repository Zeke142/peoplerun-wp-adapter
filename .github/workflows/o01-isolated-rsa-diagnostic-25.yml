name: O01 isolated RSA diagnostic candidate 25 — SOURCE ONLY
'on':
  workflow_dispatch: null
permissions:
  actions: read
concurrency:
  group: o01-isolated-rsa-read-only
  cancel-in-progress: false
jobs:
  isolated-receiver:
    if: github.repository == 'Zeke142/peoplerun-wp-adapter' && github.actor == 'Zeke142'
      && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
    - name: Verify and materialize embedded receiver
      shell: python
      run: "import base64,hashlib,pathlib\ndata={'isolated_receiver17.py': '',\
        \ 'receiver_public_log_emitter.py': ''}\n\
        expected={'isolated_receiver17.py': 'da095a08e79799afb06b2c5365b701e7bdce0d29a9d95248871136b9abe90298',\
        \ 'receiver_public_log_emitter.py': 'efb0937166d5b7757ec3e8d16616e254517eb88cf6f32239af595b3d271e64d3'}\n\
        for name,b64 in data.items():\n    raw=base64.b64decode(b64,validate=True)\n\
        \    assert hashlib.sha256(raw).hexdigest()==expected[name],name\n    pathlib.Path(name).write_bytes(raw)\n"
    - name: Emit public RSA handshake then wait
      shell: bash
      run: 'test "$(openssl version | cut -d " " -f 1)" = OpenSSL

        timeout --kill-after=2 580 python3 -u isolated_receiver17.py'
  isolated-sender:
    if: github.repository == 'Zeke142/peoplerun-wp-adapter' && github.actor == 'Zeke142'
      && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
    - name: Verify and materialize embedded sender
      shell: python
      run: "import base64,hashlib,pathlib\ndata={'isolated_sender18.py': '',\
        \ 'isolated_reader18.py': '',\
        \ 'authenticated_reader.py': '',\
        \ 'sender_log_adapter.py': '',\
        \ 'log_transport.py': '',\
        \ 'verify_log_handshake.py': ''}\n\
        expected={'isolated_sender18.py': 'cb452d1c021d81e2383fb610f236b69962be58c4a7a7eea6eec46cf859dbd8ef',\
        \ 'isolated_reader18.py': '2d61acd818ad98dbb5e11706e5468b0253d9370000c74db92e46b19b9c364e65',\
        \ 'authenticated_reader.py': '22623591de5385dc8cfdd81ee34b5a49d26538b44ef8c6a8d9eab4bb005967dd',\
        \ 'sender_log_adapter.py': 'c6736f3a03566882a72ea002db37f73ad1eefb624754e10c7efb80dd78e07927',\
        \ 'log_transport.py': '0273c4f2cb02a828bb417da5a481f5115b1444d8ed634ce643e027857bc23bae',\
        \ 'verify_log_handshake.py': 'e6a6a57029e92bfb4b9983cd85920f431db0f987f39b7c7cafe15083887350c1'}\n\
        for name,b64 in data.items():\n    raw=base64.b64decode(b64,validate=True)\n\
        \    assert hashlib.sha256(raw).hexdigest()==expected[name],name\n    pathlib.Path(name).write_bytes(raw)\n"
    - name: Retrieve and validate one in-progress public key
      shell: bash
      env:
        O01_ACTIONS_READ_TOKEN: ${{ github.token }}
      run: 'test "$(openssl version | cut -d " " -f 1)" = OpenSSL

        timeout --kill-after=2 145 python3 -u isolated_sender18.py'
