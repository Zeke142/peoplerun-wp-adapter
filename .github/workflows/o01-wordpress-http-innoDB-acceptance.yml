name: O01 disposable WordPress HTTP-to-InnoDB (owner-approved only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: o01-wordpress-http-once
  cancel-in-progress: false
jobs:
  wordpress-acceptance:
    if: github.repository == 'Zeke142/peoplerun-wp-adapter' && github.actor == 'Zeke142' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-only-root-test
          MARIADB_DATABASE: o01_ephemeral
          MARIADB_USER: o01_temp
          MARIADB_PASSWORD: local-only-test-password
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=15
    steps:
      - name: Checkout source without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install disposable PHP WordPress prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends php-cli php-mysql php-curl php-xml php-mbstring php-zip curl
          php -r 'if(!in_array("mysql",PDO::getAvailableDrivers(),true))exit(2);'
      - name: Run loopback WordPress HTTP acceptance
        run: bash o01-wordpress-http/acceptance.sh
