name: AB-01 Read-Only GitHub Host Proof (STAGING)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ab01-readonly-host-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only allowlisted GitHub API verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_ACTOR: ${{ github.actor }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          GH_SHA: ${{ github.sha }}
        shell: python
        run: |
          import base64, datetime, hashlib, json, os, pathlib, urllib.request
          repo = "Zeke142/peoplerun-wp-adapter"
          path = ".github/workflows/peoplerun-ve01-six-voice.yml"
          ref = "main"
          if os.environ["GH_REPOSITORY"] != repo:
              raise SystemExit("DENY: repository mismatch")
          if os.environ["GH_ACTOR"] != "Zeke142":
              raise SystemExit("DENY: trigger actor mismatch")
          token = os.environ["GH_TOKEN"]
          if not token:
              raise SystemExit("DENY: no ephemeral GitHub Actions credential")
          url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={ref}"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "PeopleRun-AB01-readonly"
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              obj = json.load(response)
          if obj.get("type") != "file" or obj.get("path") != path or obj.get("encoding") != "base64":
              raise SystemExit("DENY: malformed readback")
          content = base64.b64decode(obj["content"], validate=False)
          blob = "blob " + str(len(content)) + "\0"
          actual_blob_sha = hashlib.sha1(blob.encode() + content).hexdigest()
          if actual_blob_sha != obj.get("sha"):
              raise SystemExit("DENY: blob SHA mismatch")
          if len(content) > 250000:
              raise SystemExit("DENY: content too large")
          receipt = {
              "schema": "peoplerun.ab01.github_actions_host_proof.v1",
              "status": "READBACK_VERIFIED",
              "scope": "GitHub Actions ephemeral token only; NOT ChatGPT connector reuse",
              "repository": repo, "read_path": path, "read_ref": ref,
              "git_blob_sha": actual_blob_sha,
              "content_sha256": hashlib.sha256(content).hexdigest(),
              "trigger_actor": os.environ["GH_ACTOR"],
              "runner_identity": "github-actions[bot] (not the user principal)",
              "run_id": os.environ["GH_RUN_ID"],
              "run_attempt": os.environ["GH_RUN_ATTEMPT"],
              "workflow_commit": os.environ["GH_SHA"],
              "observed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "credential_exported": False, "repository_writes_performed": False,
              "cloudflare_authenticated": False, "persistent_host_proven": False,
              "owner_acceptance": "pending"
          }
          pathlib.Path("ab01-proof.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print("AB01 READBACK_VERIFIED:", actual_blob_sha)
      - name: Upload receipt only
        uses: actions/upload-artifact@v4
        with:
          name: ab01-readonly-proof
          path: ab01-proof.json
          retention-days: 1
          if-no-files-found: error
