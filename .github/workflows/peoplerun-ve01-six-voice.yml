name: PeopleRun VE-01 Six Voice Staging

# Deliberately manual only. Staged on a separate branch, not active on default.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peoplerun-ve01-manual
  cancel-in-progress: false

jobs:
  six-voice-audio:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify public repository and no repository token writes
        shell: bash
        run: |
          test "${{ github.event.repository.private }}" = "false"
          echo "Public repository; read-only token; no deployment or billing action."
      - name: Install open-source audio tooling
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s python -m pip install --disable-pip-version-check piper-tts==1.8.0
          # Bundled FFmpeg from pinned platform-specific wheel (no apt operations).
          timeout 120s python -m pip install --only-binary=:all: --disable-pip-version-check imageio-ffmpeg==0.6.0
          FFMPEG_BINARY="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          test -x "$FFMPEG_BINARY"
          ln -s "$FFMPEG_BINARY" "$RUNNER_TEMP/ffmpeg"
          export PATH="$RUNNER_TEMP:$PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          ffmpeg -hide_banner -version
      - name: Download six voice candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p voices output
          python -m piper.download_voices --download-dir voices \
            en_US-kristin-medium en_US-john-medium en_US-bryce-medium \
            en_US-ljspeech-medium en_US-norman-medium en_GB-cori-medium
      - name: Render six separate speakers and assemble demonstration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, subprocess
          voices = [
            ("Mira", "en_US-kristin-medium", "Welcome to PeopleRun Radio. Meet our panel."),
            ("Tesla", "en_US-norman-medium", "The first step is asking the right question."),
            ("Jobs", "en_US-bryce-medium", "A useful invention must delight people."),
            ("Drucker", "en_US-john-medium", "Results matter more than activity."),
            ("Grove", "en_US-ljspeech-medium", "Measure the risks before scaling."),
            ("Ogilvy", "en_GB-cori-medium", "Understand the customer before the campaign."),
          ]
          dest = pathlib.Path("output")
          for i,(character,model,text) in enumerate(voices):
              model_file = pathlib.Path("voices") / (model + ".onnx")
              assert model_file.is_file(), f"Missing model {model_file}"
              outfile = dest / f"{i:02d}_{character}.wav"
              subprocess.run(["python","-m","piper","-m",str(model_file),"-f",str(outfile),"--",text], text=True, check=True)
          (dest/"speaker_manifest.txt").write_text("\n".join(f"{name}: {model}" for name,model,_ in voices)+"\n")
          PY
          for file in output/[0-9]*.wav; do ffmpeg -hide_banner -loglevel error -y -i "$file" -ar 22050 -ac 1 "${file%.wav}_normalized.wav"; done
          for file in output/*_normalized.wav; do printf "file '%s'\n" "$(basename "$file")"; done > output/concat.txt
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i output/concat.txt -codec:a libmp3lame -qscale:a 4 output/PeopleRun_VE01_six_voice.mp3
          test -s output/PeopleRun_VE01_six_voice.mp3
          # Validate the MP3 via FFmpeg decoding (the wheel has no separate probe binary).
          python - <<'PY'
          import json, pathlib, subprocess
          audio = pathlib.Path('output/PeopleRun_VE01_six_voice.mp3')
          cmd = ['ffmpeg', '-hide_banner', '-nostats', '-loglevel', 'error', '-progress', 'pipe:1', '-i', str(audio), '-f', 'null', '-']
          result = subprocess.run(cmd, capture_output=True, text=True, timeout=90, check=True)
          durations = [int(line.split('=', 1)[1]) for line in result.stdout.splitlines() if line.startswith('out_time_us=')]
          assert durations and max(durations) > 0, 'No decoded audio duration'
          pathlib.Path('output/audio_probe.json').write_text(json.dumps({'format': {'duration': max(durations) / 1000000, 'size': audio.stat().st_size}, 'decode_verified': True}, indent=2) + '\n')
          PY
          sha256sum output/PeopleRun_VE01_six_voice.mp3 > output/SHA256SUMS
      - name: Upload generated listening artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeopleRun-VE01-Six-Voice
          path: |
            output/PeopleRun_VE01_six_voice.mp3
            output/speaker_manifest.txt
            output/audio_probe.json
            output/SHA256SUMS
          retention-days: 1
